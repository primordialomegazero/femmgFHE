# Spiral Fractal iO — Log Rotation
# Install: sudo cp scripts/logrotate.conf /etc/logrotate.d/spiralfractalio

/app/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        /bin/kill -HUP $(cat /var/run/spiralfractalio.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

/app/logs/batch_test_*.log {
    weekly
    rotate 12
    compress
    missingok
    notifempty
}
